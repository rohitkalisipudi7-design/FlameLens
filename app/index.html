<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FlameLens AI — Microgravity Combustion Science Platform</title>
    <meta name="description" content="FlameLens AI — Cinematic research and experimental design platform for studying combustion in microgravity. Built on authentic NASA PSI, NTRS, and Task Book data for Space Apps 2026." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FlameLens AI — Microgravity Combustion Science Platform" />
    <meta property="og:description" content="Explore microgravity flame behavior, connect experimental evidence, and investigate data-informed directions for future combustion research." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FlameLens AI — Microgravity Combustion Science Platform" />
    <meta name="twitter:description" content="Explore microgravity flame behavior, connect experimental evidence, and investigate data-informed directions for future combustion research." />
    <meta name="theme-color" content="#07111F" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
  </head>
  <body>
    <canvas id="space" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <div class="shell">
      <header class="topbar wrap">
        <div class="topbar-inner">
          <a class="brand" href="#panorama" aria-label="FlameLens AI, home">
            <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
              <defs>
                <radialGradient id="flame-grad" cx="50%" cy="50%" r="50%">
                  <stop offset="25%" stop-color="#FF9A3D" stop-opacity="0.95" />
                  <stop offset="65%" stop-color="#FF791F" stop-opacity="0.85" />
                  <stop offset="90%" stop-color="#20B9E8" stop-opacity="0.45" />
                  <stop offset="100%" stop-color="#20B9E8" stop-opacity="0" />
                </radialGradient>
              </defs>
              <circle cx="16" cy="16" r="15" fill="url(#flame-grad)" />
              <circle cx="16" cy="16" r="10" fill="none" stroke="#FF791F" stroke-opacity="0.9" stroke-width="1.4" />
              <circle cx="16" cy="16" r="4" fill="#F5F7FA" />
            </svg>
            <span><span class="brand-name">FlameLens AI</span><span class="brand-sub" style="display:block">Space Apps 2026 · #08</span></span>
          </a>
          <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"><span class="tab-pill" aria-hidden="true"></span></nav>
        </div>
      </header>

      <main class="wrap" id="main">
        <section class="view" id="view-panorama" role="tabpanel" aria-labelledby="tab-panorama" hidden></section>
        <section class="view" id="view-data" role="tabpanel" aria-labelledby="tab-data" hidden></section>
        <section class="view" id="view-compare" role="tabpanel" aria-labelledby="tab-compare" hidden></section>
        <section class="view" id="view-simulator" role="tabpanel" aria-labelledby="tab-simulator" hidden></section>
        <section class="view" id="view-lab3d" role="tabpanel" aria-labelledby="tab-lab3d" hidden></section>
        <section class="view" id="view-assistant" role="tabpanel" aria-labelledby="tab-assistant" hidden></section>
        <section class="view" id="view-evidence" role="tabpanel" aria-labelledby="tab-evidence" hidden></section>
        <section class="view" id="view-optimizer" role="tabpanel" aria-labelledby="tab-optimizer" hidden></section>
        <section class="view" id="view-envelope" role="tabpanel" aria-labelledby="tab-envelope" hidden></section>
        <section class="view" id="view-video-lab" role="tabpanel" aria-labelledby="tab-video-lab" hidden></section>
        <section class="view" id="view-contradiction" role="tabpanel" aria-labelledby="tab-contradiction" hidden></section>
        <section class="view" id="view-pipeline" role="tabpanel" aria-labelledby="tab-pipeline" hidden></section>
        <div class="msg-load dim" id="loading">Loading NASA flight data…</div>

        <footer class="footer">
          <span>Data Sources: NASA Physical Sciences Informatics (CC0 Public Domain), NASA Technical Reports Server (NTRS), and NASA Task Book.</span>
          <span>FlameLens AI · NASA International Space Apps Challenge 2026</span>
        </footer>
      </main>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>

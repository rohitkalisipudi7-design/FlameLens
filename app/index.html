<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Flame in Freefall — AI-Powered Microgravity Combustion Optimizer</title>
    <meta name="description" content="AI-powered experimental design optimizer and decision-support platform for microgravity combustion research, built on authentic NASA PSI, NTRS, and Task Book data." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Flame in Freefall — AI-Powered Microgravity Combustion Optimizer" />
    <meta property="og:description" content="AI-powered experimental design optimizer and decision-support platform for microgravity combustion research, built on authentic NASA PSI, NTRS, and Task Book data." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Flame in Freefall — AI-Powered Microgravity Combustion Optimizer" />
    <meta name="twitter:description" content="AI-powered experimental design optimizer and decision-support platform for microgravity combustion research, built on authentic NASA PSI, NTRS, and Task Book data." />
    <meta name="theme-color" content="#03050b" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Unbounded:wght@500;600;700&display=swap" />
  </head>
  <body>
    <canvas id="space" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <div class="shell">
      <header class="topbar wrap">
        <div class="topbar-inner">
          <a class="brand" href="#panorama" aria-label="Flame in Freefall, home">
            <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
              <defs>
                <radialGradient id="bm" cx="50%" cy="50%" r="50%">
                  <stop offset="55%" stop-color="#8fa9ff" stop-opacity="0" />
                  <stop offset="82%" stop-color="#8fa9ff" stop-opacity="0.95" />
                  <stop offset="100%" stop-color="#8fa9ff" stop-opacity="0" />
                </radialGradient>
              </defs>
              <circle cx="16" cy="16" r="15" fill="url(#bm)" />
              <circle cx="16" cy="16" r="10" fill="none" stroke="#ff9a4a" stroke-opacity="0.8" stroke-width="1.2" />
              <circle cx="16" cy="16" r="4" fill="#dfe5f2" />
            </svg>
            <span><span class="brand-name">Flame in Freefall</span><span class="brand-sub" style="display:block">Space Apps 2026 · #08</span></span>
          </a>
          <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"><span class="tab-pill" aria-hidden="true"></span></nav>
        </div>
      </header>

      <main class="wrap" id="main">
        <section class="view" id="view-panorama" role="tabpanel" aria-labelledby="tab-panorama" hidden></section>
        <section class="view" id="view-data" role="tabpanel" aria-labelledby="tab-data" hidden></section>
        <section class="view" id="view-compare" role="tabpanel" aria-labelledby="tab-compare" hidden></section>
        <section class="view" id="view-simulator" role="tabpanel" aria-labelledby="tab-simulator" hidden></section>
        <section class="view" id="view-lab3d" role="tabpanel" aria-labelledby="tab-lab3d" hidden></section>
        <section class="view" id="view-assistant" role="tabpanel" aria-labelledby="tab-assistant" hidden></section>
        <section class="view" id="view-evidence" role="tabpanel" aria-labelledby="tab-evidence" hidden></section>
        <section class="view" id="view-optimizer" role="tabpanel" aria-labelledby="tab-optimizer" hidden></section>
        <section class="view" id="view-envelope" role="tabpanel" aria-labelledby="tab-envelope" hidden></section>
        <section class="view" id="view-video-lab" role="tabpanel" aria-labelledby="tab-video-lab" hidden></section>
        <section class="view" id="view-contradiction" role="tabpanel" aria-labelledby="tab-contradiction" hidden></section>
        <section class="view" id="view-pipeline" role="tabpanel" aria-labelledby="tab-pipeline" hidden></section>
        <div class="msg-load dim" id="loading">Loading NASA data…</div>

        <footer class="footer">
          <span>Data: NASA Physical Sciences Informatics (CC0), NASA Technical Reports Server, and NASA Task Book.</span>
          <span>Team Prototype · NASA International Space Apps Challenge 2026</span>
        </footer>
      </main>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>

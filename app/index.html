    <meta property="og:title" content="FlameLens AI — Microgravity Combustion Science Platform" />
    <meta property="og:description" content="Explore microgravity flame behavior, connect experimental evidence, and investigate data-informed directions for future combustion research." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FlameLens AI — Microgravity Combustion Science Platform" />

  <body>
    <canvas id="space" aria-hidden="true" style="display:none"></canvas>
    <div class="vignette" aria-hidden="true" style="display:none"></div>

    <div class="shell">
      <header class="topbar wrap">
        <div class="topbar-inner">
          <a class="brand" href="#landing" aria-label="FlameLens AI, home">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" class="brand-star">
              <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" fill="#cc785c"/>
            </svg>
            <span><span class="brand-name">FlameLens AI</span><span class="brand-sub" style="display:block">Space Apps 2026 · #08</span></span>
          </a>
          <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"><span class="tab-pill" aria-hidden="true"></span></nav>
          <button type="button" class="theme-toggle-btn" id="theme-toggle-btn" aria-label="Toggle dark/light mode" title="Switch between dark and light mode">
            <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </header>

      <main class="wrap" id="main">
        <section class="view view-fullbleed" id="view-landing" role="tabpanel" aria-labelledby="tab-landing" hidden></section>
        <section class="view" id="view-panorama" role="tabpanel" aria-labelledby="tab-panorama" hidden></section>
        <section class="view" id="view-lab3d" role="tabpanel" aria-labelledby="tab-lab3d" hidden></section>
        <section class="view" id="view-data" role="tabpanel" aria-labelledby="tab-data" hidden></section>
        <section class="view" id="view-optimizer" role="tabpanel" aria-labelledby="tab-optimizer" hidden></section>
        <section class="view" id="view-compare" role="tabpanel" aria-labelledby="tab-compare" hidden></section>
        <div class="msg-load dim" id="loading">Loading NASA flight data…</div>

        <footer class="footer">
          <span>Data Sources: NASA Physical Sciences Informatics (CC0 Public Domain), NASA Technical Reports Server (NTRS), and NASA Task Book.</span>
          <span>FlameLens AI · Microgravity Combustion Research & Experimental Design Platform · NASA Space Apps Challenge 2026</span>
        </footer>
      </main>
    </div>

    <script type="module" src="./src/main.js"></script>
